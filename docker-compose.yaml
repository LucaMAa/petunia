version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: petunia-postgres
    environment:
      POSTGRES_USER: petunia
      POSTGRES_PASSWORD: petunia
      POSTGRES_DB: petunia
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - petunia-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petunia"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: petunia-redis
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - petunia-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  petunia-network:
    driver: bridge
